pipeline:
  name: gincache_ci
  identifier: gincache_ci
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubrunnersci
        repoName: gincache
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: CI
        identifier: CI
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  identifier: test
                  name: Run Tests
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.18
                    shell: Bash
                    command: |-
                      go mod tidy
                      go test -coverprofile=coverage.out -count=1 ./...
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  when:
                    stageStatus: Success
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage.out"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/*_test.go,**/vendor/**"
